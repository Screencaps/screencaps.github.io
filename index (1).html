<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SCREENCAPS — кино в кадрах</title><style>
*{box-sizing:border-box}body{margin:0;background:#101218;color:#e9edf5;font:16px system-ui,sans-serif}main,header>div{max-width:1200px;margin:auto;padding:24px}header{border-bottom:1px solid #303542}h1{font-size:30px;letter-spacing:4px;margin:0}h1 span{color:#82aaff}p,small{color:#a5aec0}button,input,select{font:inherit;color:inherit;background:#202530;border:1px solid #363e50;border-radius:8px;padding:10px}button{cursor:pointer}button:hover,button.active{background:#3456a0;border-color:#82aaff}#search{width:100%;padding:15px}.bar{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.alphabet button{padding:8px;min-width:35px}.filters{display:flex;gap:16px;flex-wrap:wrap}.filters label{display:flex;flex-direction:column;gap:6px}#genres{min-width:180px;max-height:130px}.panel{background:#191d26;border:1px solid #303542;border-radius:14px;padding:20px;margin:20px 0}.results{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}.movie{text-align:left;padding:0;overflow:hidden;background:#191d26;border-radius:12px}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#303d58,#141822);display:grid;place-items:center;font-size:42px;color:#8b9cbd;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.info{padding:14px;display:grid;gap:7px}.info strong{font-size:18px}.info small{line-height:1.5}a{color:#82aaff}a.vk{display:inline-block;background:#0077ff;color:white;text-decoration:none;padding:12px;border-radius:8px;margin:5px 8px 5px 0}#detail .poster{width:160px;float:left;margin:0 24px 20px 0}#detail:after{content:'';display:block;clear:both}details{clear:both;padding:12px;border-bottom:1px solid #303542}summary{cursor:pointer}footer{text-align:center;color:#a5aec0;padding:30px} [hidden]{display:none!important}@media(max-width:500px){main,header>div{padding:14px}#cards{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:12px}h1{font-size:24px}#detail .poster{width:105px}}
</style></head><body><header><div><h1>SCREEN<span>CAPS</span></h1><p>Кино в кадрах · каталог фильмов и сериалов</p></div></header><main><section id="catalog"><input id="search" placeholder="Поиск по русскому или оригинальному названию" aria-label="Поиск"><nav id="categories" class="bar" aria-label="Категории"></nav><section class="panel"><h2>Алфавитный указатель</h2><div id="ru" class="bar alphabet"></div><div id="en" class="bar alphabet"></div><div class="filters"><label>Год от<select id="from"></select></label><label>Год до<select id="to"></select></label><label>Жанры (Ctrl для нескольких)<select id="genres" multiple size="4"></select></label></div><button id="reset" style="margin-top:15px">Сбросить фильтры</button></section><div class="results"><p id="count" aria-live="polite"></p><label>Сортировка <select id="sort"><option value="az">А–Я</option><option value="za">Я–А</option><option value="new">Сначала новые</option><option value="old">Сначала старые</option><option value="added">Недавно добавленные</option></select></label></div><p id="status"></p><div id="cards"></div></section><section id="detail" hidden></section></main><footer>SCREENCAPS · Каталог материалов ВКонтакте</footer><script>
// Позже здесь будет адрес опубликованной Google Таблицы в формате CSV.
const SHEET_URL='';
const demo=[
{id:'batman',title:'Бэтмен',original:'The Batman',year:2022,type:'Фильмы',genres:'Боевик, Детектив, Криминал',description:'Бэтмен расследует загадочные преступления в Готэме.'},
{id:'teen-wolf',title:'Волчонок',original:'Teen Wolf',year:2011,type:'Сериалы',genres:'Фэнтези, Драма',description:'Подросток сталкивается со сверхъестественным миром после укуса оборотня.'},
{id:'frozen',title:'Холодное сердце',original:'Frozen',year:2013,type:'Мультфильмы',genres:'Фэнтези, Приключения',description:'Анна отправляется на поиски своей сестры Эльзы.'},
{id:'true-beauty',title:'Истинная красота',original:'True Beauty',year:2020,type:'Дорамы',genres:'Мелодрама, Комедия',description:'История школьницы, которая учится принимать себя.'},
{id:'gravity-falls',title:'Гравити Фолз',original:'Gravity Falls',year:2012,type:'Мультсериалы',genres:'Приключения, Детектив, Комедия',description:'Близнецы проводят лето в городе, полном загадок.'},
{id:'now-you-see-me',title:'Иллюзия обмана',original:'Now You See Me',year:2013,type:'Фильмы',genres:'Триллер, Криминал',description:'Команда иллюзионистов устраивает необычные представления.'}];
let data=demo,category='Все',letter='Все';const $=id=>document.getElementById(id);const cats=['Все','Фильмы','Сериалы','Мультфильмы','Дорамы','Мультсериалы'];const genreList=['Боевик','Комедия','Драма','Мелодрама','Фантастика','Фэнтези','Ужасы','Триллер','Детектив','Криминал','Приключения','Исторический','Документальный','Семейный','Мюзикл','Спорт','Военный','Биография','Вестерн'];
function el(tag,txt,cls){const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}function btn(txt,fn,active){const b=el('button',txt,active?'active':'');b.onclick=fn;b.setAttribute('aria-pressed',String(!!active));return b}function options(){for(const id of ['from','to']){const s=$(id);s.replaceChildren(new Option('Любой',''));for(let y=new Date().getFullYear()+1;y>=1888;y--)s.add(new Option(y,y))} $('genres').replaceChildren(...[...new Set([...genreList,...data.flatMap(f=>(f.genres||'').split(',').map(g=>g.trim()).filter(Boolean))])].sort((a,b)=>a.localeCompare(b,'ru')).map(g=>new Option(g,g)))}
function navigation(){ $('categories').replaceChildren(...cats.map(c=>btn(c,()=>{category=c;render()},category===c)));for(const [id,letters] of [['ru',['Все','0–9',...'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ']],['en',[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ']]])$(id).replaceChildren(...letters.map(l=>btn(l,()=>{letter=l;render()},letter===l)))}
function poster(f){const p=el('div','🎬','poster');if(f.poster&&/^https?:\/\//i.test(f.poster)){const im=el('img');im.src=f.poster;im.alt=f.title;im.loading='lazy';im.onerror=()=>im.remove();p.append(im);p.firstChild.remove()}return p}
function render(){navigation();let q=$('search').value.trim().toLowerCase(),gs=[...$('genres').selectedOptions].map(o=>o.value),a=$('from').value,b=$('to').value;let rows=data.filter(f=>{let title=(f.title||'').toUpperCase(),original=(f.original||'').toUpperCase();return(category==='Все'||f.type===category)&&(letter==='Все'||(letter==='0–9'?/^\d/.test(title):(/[A-Z]/.test(letter)?original.startsWith(letter)||title.startsWith(letter):title.startsWith(letter))))&&(!a||Number(f.year)>=Number(a))&&(!b||Number(f.year)<=Number(b))&&gs.every(g=>(f.genres||'').split(',').map(x=>x.trim()).includes(g))&&(`${f.title} ${f.original||''}`.toLowerCase().includes(q))});let sort=$('sort').value;rows.sort((a,b)=>sort==='new'?b.year-a.year:sort==='old'?a.year-b.year:sort==='added'?data.indexOf(b)-data.indexOf(a):(sort==='za'?-1:1)*a.title.localeCompare(b.title,'ru'));$('count').textContent='Найдено: '+rows.length;$('cards').replaceChildren();for(const f of rows){const c=el('button','','movie'),info=el('div','','info');info.append(el('strong',f.title),el('small',`${f.year||''} · ${f.type}`),el('small',f.genres));c.append(poster(f),info);c.onclick=()=>location.hash='film/'+encodeURIComponent(f.id);$('cards').append(c)}if(!rows.length)$('cards').append(el('p','Ничего не найдено. Измените фильтры.'))}
function link(parent,url,label){try{const u=new URL(url);if(u.protocol!=='https:'||!['vk.com','vk.ru','m.vk.com','m.vk.ru'].includes(u.hostname))return;const a=el('a',label,'vk');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}catch{}}
function route(){const id=location.hash.startsWith('#film/')?decodeURIComponent(location.hash.slice(6)):'';const f=data.find(x=>x.id===id);$('catalog').hidden=!!f;$('detail').hidden=!f;if(!f)return;const d=$('detail');d.replaceChildren(btn('← Назад к каталогу',()=>location.hash=''));const box=el('div','','panel');box.append(poster(f),el('h2',f.title),el('p',f.original),el('p',`${f.year} · ${f.type} · ${f.genres}`),el('h3','Описание'),el('p',f.description||'Описание пока не добавлено'),el('h3','Материалы ВКонтакте'));link(box,f.album,'Фотоальбом ВКонтакте');link(box,f.post,'Публикация ВКонтакте');if(!f.album&&!f.post)box.append(el('p','Ссылки пока не добавлены.'));if(['Сериалы','Дорамы','Мультсериалы'].includes(f.type)){box.append(el('h3','Сезоны и серии'));let episodes=[];try{episodes=JSON.parse(f.episodes||'[]')}catch{};for(const season of episodes){const det=el('details');det.append(el('summary','Сезон '+season.season));for(const ep of season.items||[]){const r=el('div');r.append(el('p','Серия '+ep.number+(ep.title?' — '+ep.title:'')));link(r,ep.album,'Фотоальбом');link(r,ep.post,'Публикация');det.append(r)}box.append(det)}if(!episodes.length)box.append(el('p','Серии пока не добавлены.'))}d.append(box);window.scrollTo(0,0)}
function parseCSV(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}const keys=(rows.shift()||[]).map(x=>x.trim().replace(/^\uFEFF/,''));return rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]||'']))).filter(f=>f.id&&f.title&&cats.includes(f.type))}
for(const id of ['search','from','to','genres','sort'])$(id).addEventListener(id==='search'?'input':'change',render);$('reset').onclick=()=>{category=letter='Все';$('search').value=$('from').value=$('to').value='';for(const o of $('genres').options)o.selected=false;$('sort').value='az';render()};window.addEventListener('hashchange',route);options();render();route();if(!SHEET_URL)$('status').textContent='Демонстрационный каталог. Реальные материалы будут добавлены после подключения таблицы.';else fetch(SHEET_URL).then(r=>{if(!r.ok)throw Error();return r.text()}).then(s=>{data=parseCSV(s);options();render();route()}).catch(()=>{$('status').textContent='Не удалось загрузить таблицу. Показаны демонстрационные данные.'});
</script></body></html>
